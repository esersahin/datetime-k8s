kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
# Control Plane Node
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP

# Worker Node 1
- role: worker
  labels:
    worker-group: group-1

# Worker Node 2
- role: worker
  labels:
    worker-group: group-2
