<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarih ve Saat Uygulaması</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }

      h1 {
        color: #667eea;
        margin-bottom: 30px;
        font-size: 2em;
      }

      .datetime-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 15px;
        padding: 30px;
        margin: 20px 0;
        color: white;
      }

      .date {
        font-size: 2.5em;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .time {
        font-size: 3em;
        font-weight: bold;
        margin-bottom: 10px;
        font-variant-numeric: tabular-nums;
      }

      .day {
        font-size: 1.5em;
        opacity: 0.9;
      }

      .status {
        padding: 10px;
        border-radius: 10px;
        margin-top: 20px;
        font-weight: bold;
      }

      .status.loading {
        background: #fef3c7;
        color: #92400e;
      }

      .status.success {
        background: #d1fae5;
        color: #065f46;
      }

      .status.error {
        background: #fee2e2;
        color: #991b1b;
      }

      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 1.1em;
        cursor: pointer;
        margin-top: 20px;
        transition: transform 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🕐 Tarih ve Saat</h1>

      <div id="content">
        <div class="datetime-box">
          <div class="date" id="date">--.--.----</div>
          <div class="time" id="time">--:--:--</div>
          <div class="day" id="day">-----</div>
        </div>

        <div class="status loading" id="status">
          <span class="loading-spinner"></span> Yükleniyor...
        </div>
      </div>

      <button onclick="fetchDateTime()">🔄 Yenile</button>
    </div>

    <script>
      const API_URL = "http://api.local/api/datetime";

      async function fetchDateTime() {
        const statusEl = document.getElementById("status");
        statusEl.style.display = "block";
        statusEl.className = "status loading";
        statusEl.innerHTML =
          '<span class="loading-spinner"></span> Yükleniyor...';

        try {
          const response = await fetch(API_URL);

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          document.getElementById("date").textContent = data.date;
          document.getElementById("time").textContent = data.time;
          document.getElementById("day").textContent = data.dayOfWeek;

          statusEl.className = "status success";
          statusEl.textContent = "✅ Başarıyla güncellendi!";

          setTimeout(() => {
            statusEl.style.display = "none";
          }, 3000);
        } catch (error) {
          console.error("Error:", error);
          statusEl.className = "status error";
          statusEl.textContent = "❌ Hata: " + error.message;
        }
      }

      // Sayfa yüklendiğinde veriyi getir
      fetchDateTime();

      // Her 30 saniyede bir otomatik güncelle
      setInterval(fetchDateTime, 30000);
    </script>
  </body>
</html>
