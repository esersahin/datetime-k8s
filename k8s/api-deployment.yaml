apiVersion: apps/v1
kind: Deployment
metadata:
  name: datetime-api
  labels:
    app: datetime-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datetime-api
  template:
    metadata:
      labels:
        app: datetime-api
    spec:
      containers:
        - name: api
          image: datetime-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: TZ
              value: "Europe/Istanbul"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: datetime-api-service
  labels:
    app: datetime-api
  annotations:
    description: "API Service - Routes traffic to worker nodes"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  # IMPORTANT: selector MUST match pod labels
  selector:
    app: datetime-api
  # Session affinity - aynı client aynı pod'a yönlendirilir (opsiyonel)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300
