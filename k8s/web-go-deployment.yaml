apiVersion: apps/v1
kind: Deployment
metadata:
  name: datetime-web-go
  labels:
    app: datetime-web-go
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1 # Aynı anda en fazla 1 pod kapalı olabilir
      maxSurge: 1 # Güncelleme sırasında +1 extra pod çalışabilir
  selector:
    matchLabels:
      app: datetime-web-go
  template:
    metadata:
      labels:
        app: datetime-web-go
    spec:
      containers:
        - name: web-go
          image: datetime-web-go:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: datetime-web-go-service
  labels:
    app: datetime-web-go
  annotations:
    description: "Web-Go Service - Routes traffic to worker nodes"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  # IMPORTANT: selector MUST match pod labels
  selector:
    app: datetime-web-go
  # Session affinity: None = Round Robin load balancing
  # Stateless web app için en iyi seçenek
  sessionAffinity: None
