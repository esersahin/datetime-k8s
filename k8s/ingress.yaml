apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datetime-ingress
  annotations:
    # CORS ayarları
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # Multi-node için önemli: Service-based routing
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Load balancing stratejisi: Round Robin
    # round_robin: İstekler sırayla dağıtılır (en dengeli, stateless API'ler için ideal)
    # least_conn: En az bağlantısı olan pod'a gider
    # ip_hash: Aynı client IP her zaman aynı pod'a gider (sticky sessions)
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
    # Performans optimizasyonları
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    # Upstream keepalive
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "100"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "1000"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # API Ingress - C# API (worker node'lardaki pod'lara yönlendirir)
    - host: api-csharp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datetime-api-csharp-service
                port:
                  number: 80
    # API Go Ingress - Go API (worker node'lardaki pod'lara yönlendirir)
    - host: api-go.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datetime-api-go-service
                port:
                  number: 80
    # Web Ingress - C# Web (worker node'lardaki pod'lara yönlendirir)
    - host: web-csharp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datetime-web-csharp-service
                port:
                  number: 80
    # Web Go Ingress - Go Web (worker node'lardaki pod'lara yönlendirir)
    - host: web-go.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datetime-web-go-service
                port:
                  number: 80
