---
# SecretStore - Vault bağlantı yapılandırması
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: default
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth method kullanarak Vault'a authentication
        kubernetes:
          mountPath: "kubernetes"
          role: "datetime-app"
          serviceAccountRef:
            name: "datetime-app"
---
# ExternalSecret - C# API için secret'ları Vault'tan çeker
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datetime-api-csharp-secrets
  namespace: default
spec:
  refreshInterval: 1h  # Her saat secret'ları yenile
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: datetime-api-csharp-secrets  # Oluşturulacak Kubernetes Secret'ın adı
    creationPolicy: Owner
  data:
    # Vault'taki secret/datetime/api-csharp path'inden secret'ları al
    - secretKey: TIMEZONE
      remoteRef:
        key: datetime/api-csharp
        property: timezone

    - secretKey: LOG_LEVEL
      remoteRef:
        key: datetime/api-csharp
        property: log_level

    - secretKey: DATABASE_URL
      remoteRef:
        key: datetime/api-csharp
        property: database_url

    - secretKey: API_KEY
      remoteRef:
        key: datetime/api-csharp
        property: api_key

    - secretKey: JWT_SECRET
      remoteRef:
        key: datetime/api-csharp
        property: jwt_secret

    - secretKey: REDIS_URL
      remoteRef:
        key: datetime/api-csharp
        property: redis_url
---
# ExternalSecret - Go API için secret'ları Vault'tan çeker
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datetime-api-go-secrets
  namespace: default
spec:
  refreshInterval: 1h  # Her saat secret'ları yenile
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: datetime-api-go-secrets  # Oluşturulacak Kubernetes Secret'ın adı
    creationPolicy: Owner
  data:
    # Vault'taki secret/datetime/api-go path'inden secret'ları al
    - secretKey: TIMEZONE
      remoteRef:
        key: datetime/api-go
        property: timezone

    - secretKey: LOG_LEVEL
      remoteRef:
        key: datetime/api-go
        property: log_level

    - secretKey: DATABASE_URL
      remoteRef:
        key: datetime/api-go
        property: database_url

    - secretKey: API_KEY
      remoteRef:
        key: datetime/api-go
        property: api_key

    - secretKey: JWT_SECRET
      remoteRef:
        key: datetime/api-go
        property: jwt_secret

    - secretKey: REDIS_URL
      remoteRef:
        key: datetime/api-go
        property: redis_url
