# HAProxy Load Balancer Configuration for Kind Cluster
# Otomatik olarak tüm worker node'lara traffic dağıtır
# Worker node'lar DNS ile çözümlenir (kind-worker, kind-worker2, kind-worker3)

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 2000ms
    timeout client  50000ms
    timeout server  50000ms
    
    # Hızlı failover için
    timeout check 1000ms
    retries 2

# HTTP Traffic (port 80)
frontend http_frontend
    bind *:80
    mode http
    default_backend workers_http

# HTTP Load Balancer Backend
backend workers_http
    mode http
    balance roundrobin
    
    option httpchk GET /healthz
    http-check expect status 200-499
    
    # Worker node'lar - DNS ile otomatik çözümlenir
    # Kind container isimleri Docker DNS ile erişilebilir
    server worker1 kind-worker:80 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4
    server worker2 kind-worker2:80 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4
    server worker3 kind-worker3:80 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4

# HTTPS Traffic (port 443)
frontend https_frontend
    bind *:443
    mode tcp
    option tcplog
    default_backend workers_https

backend workers_https
    mode tcp
    balance roundrobin
    
    option tcp-check
    
    server worker1 kind-worker:443 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4
    server worker2 kind-worker2:443 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4
    server worker3 kind-worker3:443 check inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4

# Stats page
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

# DNS Resolver configuration
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
