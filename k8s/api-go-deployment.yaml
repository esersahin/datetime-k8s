apiVersion: apps/v1
kind: Deployment
metadata:
  name: datetime-api-go
  labels:
    app: datetime-api-go
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1  # Aynı anda en fazla 1 pod kapalı olabilir
      maxSurge: 1        # Güncelleme sırasında +1 extra pod çalışabilir
  selector:
    matchLabels:
      app: datetime-api-go
  template:
    metadata:
      labels:
        app: datetime-api-go
    spec:
      serviceAccountName: datetime-app  # Vault auth için gerekli
      containers:
        - name: api-go
          image: datetime-api-go:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            # Static configuration
            - name: ENVIRONMENT
              value: "development"  # development | staging | production
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSHARP_API_URL
              value: "http://datetime-api-service"

            # Secrets from Vault (via External Secrets Operator)
            # Go API kendi bağımsız secret'larını kullanır
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: datetime-api-go-secrets
                  key: TIMEZONE
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: datetime-api-go-secrets
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: datetime-api-go-secrets
                  key: DATABASE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: datetime-api-go-secrets
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: datetime-api-go-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: datetime-api-go-secrets
                  key: REDIS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: datetime-api-go-service
  labels:
    app: datetime-api-go
  annotations:
    description: "Go API Service - Routes traffic to worker nodes"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: datetime-api-go
  # Session affinity: None = Round Robin load balancing
  # Stateless API için en iyi seçenek
  sessionAffinity: None
