apiVersion: apps/v1
kind: Deployment
metadata:
  name: datetime-api-csharp
  labels:
    app: datetime-api-csharp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1  # Aynı anda en fazla 1 pod kapalı olabilir
      maxSurge: 1        # Güncelleme sırasında +1 extra pod çalışabilir
  selector:
    matchLabels:
      app: datetime-api-csharp
  template:
    metadata:
      labels:
        app: datetime-api-csharp
    spec:
      containers:
        - name: api
          image: datetime-api-csharp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: TZ
              value: "Europe/Istanbul"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GO_API_URL
              value: "http://datetime-api-go-service"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: datetime-api-csharp-service
  labels:
    app: datetime-api-csharp
  annotations:
    description: "C# API Service - Routes traffic to worker nodes"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  # IMPORTANT: selector MUST match pod labels
  selector:
    app: datetime-api-csharp
  # Session affinity: None = Round Robin load balancing
  # Stateless API için en iyi seçenek
  sessionAffinity: None
