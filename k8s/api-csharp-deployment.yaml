apiVersion: apps/v1
kind: Deployment
metadata:
  name: datetime-api-csharp
  labels:
    app: datetime-api-csharp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1 # Aynı anda en fazla 1 pod kapalı olabilir
      maxSurge: 1 # Güncelleme sırasında +1 extra pod çalışabilir
  selector:
    matchLabels:
      app: datetime-api-csharp
  template:
    metadata:
      labels:
        app: datetime-api-csharp
    spec:
      serviceAccountName: datetime-app  # Vault auth için gerekli
      containers:
        - name: api
          image: datetime-api-csharp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            # Static configuration
            - name: ENVIRONMENT
              value: "development"  # development | staging | production
            - name: DOTNET_gcServer
              value: "1"
            - name: DOTNET_GCHeapHardLimitPercent
              value: "60"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"  # Development | Staging | Production
            - name: GO_API_URL
              value: "http://datetime-api-go-service"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # Secrets from Vault (via External Secrets Operator)
            # C# API kendi bağımsız secret'larını kullanır
            - name: TZ
              valueFrom:
                secretKeyRef:
                  name: datetime-api-csharp-secrets
                  key: TIMEZONE
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: datetime-api-csharp-secrets
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: datetime-api-csharp-secrets
                  key: DATABASE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: datetime-api-csharp-secrets
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: datetime-api-csharp-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: datetime-api-csharp-secrets
                  key: REDIS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: datetime-api-csharp-service
  labels:
    app: datetime-api-csharp
  annotations:
    description: "C# API Service - Routes traffic to worker nodes"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  # IMPORTANT: selector MUST match pod labels
  selector:
    app: datetime-api-csharp
  # Session affinity: None = Round Robin load balancing
  # Stateless API için en iyi seçenek
  sessionAffinity: None
